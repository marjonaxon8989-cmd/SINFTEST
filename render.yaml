services:
  - type: web
    name: duelum-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHANNEL
        value: "@DUELUM"
      - key: ADMIN_USERNAME
        value: barhayot_madaminov
      - key: PYTHON_VERSION
        value: "3.12.4"
